<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">Écart observé et écart miroir dans un test bilatéral</title>
  <desc id="desc">La moyenne 16,67 est au centre. Les résultats 8,33 et 25 sont à la même distance de la moyenne. Les nombres entiers extrêmes sont 8 ou moins et 25 ou plus.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#46546a" />
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #253047; }
      .small { font-size: 15px; }
      .label { font-size: 17px; font-weight: 650; }
    </style>
  </defs>
  <rect width="900" height="300" rx="18" fill="#f7f8f2" />
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700">On reporte le même écart de l’autre côté de la moyenne</text>

  <line x1="70" y1="165" x2="830" y2="165" stroke="#526176" stroke-width="3" />
  <line x1="91" y1="165" x2="273" y2="165" stroke="#d96b55" stroke-width="12" stroke-linecap="round" />
  <line x1="703" y1="165" x2="830" y2="165" stroke="#d96b55" stroke-width="12" stroke-linecap="round" />

  <line x1="492" y1="83" x2="492" y2="189" stroke="#44806a" stroke-width="3" stroke-dasharray="6 5" />
  <circle cx="492" cy="165" r="8" fill="#44806a" />
  <circle cx="281" cy="165" r="8" fill="#d96b55" />
  <circle cx="703" cy="165" r="8" fill="#d96b55" />

  <line x1="294" y1="103" x2="479" y2="103" stroke="#46546a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <line x1="505" y1="103" x2="690" y2="103" stroke="#46546a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <text x="387" y="90" text-anchor="middle" class="small">8,33</text>
  <text x="598" y="90" text-anchor="middle" class="small">8,33</text>

  <text x="281" y="207" text-anchor="middle" class="label">8,33</text>
  <text x="492" y="207" text-anchor="middle" class="label">16,67</text>
  <text x="703" y="207" text-anchor="middle" class="label">25</text>
  <text x="492" y="235" text-anchor="middle" class="small">moyenne attendue</text>
  <text x="281" y="258" text-anchor="middle" class="small" fill="#a84535">X ≤ 8 (entier)</text>
  <text x="703" y="258" text-anchor="middle" class="small" fill="#a84535">X ≥ 25</text>
  <text x="450" y="285" text-anchor="middle" font-size="14" fill="#596579">Les deux zones rouges sont aussi éloignées ou plus éloignées de la moyenne que 25.</text>
</svg>
