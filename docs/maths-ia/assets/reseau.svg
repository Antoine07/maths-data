<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="titre description">
<title id="titre">De trois caractéristiques à une probabilité</title>
<desc id="description">Les trois entrées passent par une couche affine de quatre sorties, une activation ReLU, une couche affine de sortie et une sigmoïde. La propagation avant utilise des paramètres fournis ; elle ne les met pas à jour.</desc>
<rect x="1" y="1" width="898" height="248" rx="20" fill="#f7f8f2" stroke="#dce2d9"/>
<defs><marker id="fleche" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#275c47"/></marker></defs>
<g font-family="Arial, sans-serif" text-anchor="middle" fill="#203b36">
<text x="450" y="35" font-size="23" font-weight="700">La propagation avant : calculer une sortie</text>
<g fill="white" stroke="#dce2d9"><rect x="20" y="75" width="150" height="105" rx="15"/><rect x="215" y="75" width="160" height="105" rx="15"/><rect x="420" y="75" width="120" height="105" rx="15"/><rect x="585" y="75" width="125" height="105" rx="15"/><rect x="755" y="75" width="125" height="105" rx="15"/></g>
<g stroke="#275c47" stroke-width="2" marker-end="url(#fleche)"><path d="M175 128 H205"/><path d="M380 128 H410"/><path d="M545 128 H575"/><path d="M715 128 H745"/></g>
<text x="95" y="112" font-size="20" font-weight="700">3 entrées</text><text x="95" y="140" font-size="15">Température</text><text x="95" y="161" font-size="15">Occupation, équipements</text>
<text x="295" y="113" font-size="20" font-weight="700">Couche affine</text><text x="295" y="145" font-size="20">XW₁ + b₁</text><text x="295" y="167" font-size="15">4 scores cachés</text>
<text x="480" y="116" font-size="20" font-weight="700">ReLU</text><text x="480" y="145" font-size="18">max(0, z)</text><text x="480" y="167" font-size="15">4 activations</text>
<text x="647" y="114" font-size="20" font-weight="700">Sortie</text><text x="647" y="145" font-size="19">HW₂ + b₂</text><text x="647" y="167" font-size="15">1 logit</text>
<text x="817" y="114" font-size="20" font-weight="700">Sigmoïde</text><text x="817" y="146" font-size="20">p ∈ [0, 1]</text><text x="817" y="168" font-size="15">Probabilité estimée</text>
<text x="450" y="221" font-size="17" fill="#63716a">Les poids et les biais sont fournis ici ; leur apprentissage sera étudié après le gradient.</text>
</g></svg>
