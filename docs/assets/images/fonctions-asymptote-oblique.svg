<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Courbe et asymptotes de f(x) = x + 3 − 1/x</title>
  <desc id="desc">Le graphique montre les deux branches de f(x)=x+3−1/x, la droite asymptote oblique y=x+3 en pointillés verts, et l’asymptote verticale x=0 en pointillés orangés. La courbe s’approche de la droite oblique aux deux infinis.</desc>
  <rect width="900" height="430" rx="16" fill="#f7f8f2"/>
  <defs>
    <marker id="delta-arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b65d55"/></marker>
  </defs>
  <text x="450" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#203b32">La courbe se rapproche de son asymptote oblique</text>
  <rect x="88" y="48" width="775" height="320" rx="8" fill="#fff" stroke="#d9e0d8"/>
  <g stroke="#e7ebe6" stroke-width="1">
    <path d="M88 85H863 M88 174H863 M88 262H863 M88 350H863"/>
    <path d="M88 48V368 M243 48V368 M553 48V368 M708 48V368 M863 48V368"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#58675f">
    <text x="78" y="354" text-anchor="end">−5</text><text x="78" y="266" text-anchor="end">0</text><text x="78" y="178" text-anchor="end">5</text><text x="78" y="89" text-anchor="end">10</text>
    <text x="88" y="389" text-anchor="middle">−4</text><text x="243" y="389" text-anchor="middle">−2</text><text x="398" y="389" text-anchor="middle">0</text><text x="553" y="389" text-anchor="middle">2</text><text x="708" y="389" text-anchor="middle">4</text><text x="863" y="389" text-anchor="middle">6</text>
    <text x="850" y="253" text-anchor="end" font-style="italic">x</text><text x="408" y="61" font-style="italic">y</text>
  </g>
  <path d="M88 262H863" stroke="#53635b" stroke-width="2"/>
  <path d="M398 48V368" stroke="#d48843" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M88 289L863 116" fill="none" stroke="#39806d" stroke-width="4" stroke-dasharray="11 8"/>
  <path d="M88 285 L165.5 265.9 L243 245.3 L281.8 233.5 L320.5 218.8 L339.9 208.5 L359.2 192.3 L370.9 174.5 L378.6 152.6 L384.1 123.9 L387.1 95.2 L388.7 73.8" fill="none" stroke="#526fa8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M407.5 360 L408.1 352.3 L409.6 333.8 L411.9 313.7 L413.5 303.5 L417.4 285 L421.2 272.3 L429 255.9 L436.8 245.3 L456.1 229.1 L475.5 218.8 L514.2 204.1 L553 192.3 L630.5 171.7 L708 152.6 L785.5 134.1 L863 115.8" fill="none" stroke="#526fa8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M359.2 228V193" fill="none" stroke="#b65d55" stroke-width="2.5" marker-start="url(#delta-arrow)" marker-end="url(#delta-arrow)"/>
  <path d="M436.8 210V245" fill="none" stroke="#b65d55" stroke-width="2.5" marker-start="url(#delta-arrow)" marker-end="url(#delta-arrow)"/>
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="650">
    <rect x="608" y="63" width="218" height="31" rx="7" fill="#fff" opacity=".94"/>
    <text x="620" y="84" fill="#28715e">Asymptote : y = x + 3</text>
    <rect x="413" y="71" width="175" height="29" rx="7" fill="#fff" opacity=".94"/>
    <text x="422" y="91" fill="#a65e20">Asymptote verticale : x = 0</text>
    <rect x="172" y="154" width="169" height="28" rx="7" fill="#fff" opacity=".94"/>
    <text x="181" y="174" fill="#455e91">Courbe au-dessus (x &lt; 0)</text>
    <rect x="465" y="267" width="180" height="28" rx="7" fill="#fff" opacity=".94"/>
    <text x="474" y="287" fill="#455e91">Courbe en dessous (x &gt; 0)</text>
    <rect x="736" y="143" width="75" height="29" rx="7" fill="#fff" opacity=".94"/>
    <text x="747" y="163" fill="#455e91">f(x)</text>
  </g>
  <text x="450" y="417" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#52645b">Pour x → ±∞, l’écart entre la courbe et la droite tend vers 0.</text>
</svg>
