<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="titre description">
  <title id="titre">Développer et factoriser : deux écritures d'une même aire</title>
  <desc id="description">Pour x positif, un rectangle de côtés x plus 2 et x plus 3 est découpé en quatre parties d'aires x carré, 3x, 2x et 6. Son aire s'écrit aussi bien (x + 2)(x + 3) que x carré + 5x + 6. Développer et factoriser permettent de passer d'une écriture à l'autre.</desc>
  <defs>
    <clipPath id="rectangle"><rect x="70" y="70" width="220" height="200" rx="14"/></clipPath>
    <marker id="fleche-verte" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#275c47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="fleche-violette" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#80659b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="900" height="320" rx="20" fill="#f7f8f2"/>
  <g clip-path="url(#rectangle)">
    <rect x="70" y="70" width="160" height="160" fill="#275c47"/>
    <rect x="230" y="70" width="60" height="160" fill="#ddf18a"/>
    <rect x="70" y="230" width="160" height="40" fill="#e4edda"/>
    <rect x="230" y="230" width="60" height="40" fill="#e3d7ee"/>
  </g>
  <path d="M230 70V270 M70 230H290" fill="none" stroke="#f7f8f2" stroke-width="3"/>
  <rect x="70" y="70" width="220" height="200" rx="14" fill="none" stroke="#203b36" stroke-opacity=".12"/>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#203b36">
    <text x="150" y="53" font-size="22" font-style="italic">x</text>
    <text x="260" y="53" font-size="22">3</text>
    <text x="46" y="158" font-size="22" font-style="italic">x</text>
    <text x="46" y="257" font-size="22">2</text>
    <text x="150" y="167" font-size="42" fill="#fff" font-style="italic">x²</text>
    <text x="260" y="161" font-size="27">3x</text>
    <text x="150" y="259" font-size="25">2x</text>
    <text x="260" y="259" font-size="25" fill="#66518b">6</text>
    <text x="620" y="110" font-size="36">(x + 2)(x + 3)</text>
    <text x="620" y="234" font-size="36">x² + 5x + 6</text>
  </g>
  <path d="M660 140V190" stroke="#275c47" stroke-width="2" marker-end="url(#fleche-verte)" fill="none"/>
  <path d="M580 190V140" stroke="#80659b" stroke-width="2" marker-end="url(#fleche-violette)" fill="none"/>
  <g font-family="Arial, sans-serif" font-size="14">
    <text x="685" y="170" fill="#275c47">Développer</text>
    <text x="555" y="170" text-anchor="end" fill="#80659b">Factoriser</text>
    <text x="620" y="277" text-anchor="middle" fill="#63716a">Deux écritures, une même expression.</text>
  </g>
</svg>
