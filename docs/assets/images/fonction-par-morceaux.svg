<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Graphique d'une fonction définie par morceaux</title>
  <desc id="desc">La droite y égale x plus 2 est tracée pour x négatif et se termine par un point ouvert en (0,2). La parabole y égale x au carré est tracée pour x positif ou nul et commence par un point plein en (0,0). La fonction présente un saut en zéro.</desc>
  <rect width="760" height="390" rx="18" fill="#f7f8f2"/>
  <rect x="86" y="35" width="600" height="300" rx="8" fill="#fff"/>
  <g stroke="#e2e7e0" stroke-width="1">
    <path d="M146 35V335 M206 35V335 M266 35V335 M326 35V335 M386 35V335 M446 35V335 M506 35V335 M566 35V335 M626 35V335"/>
    <path d="M86 65H686 M86 125H686 M86 185H686 M86 245H686 M86 305H686"/>
  </g>
  <g stroke="#4b5563" stroke-width="2">
    <path d="M86 185H686"/><path d="M386 335V35"/>
  </g>
  <g fill="#4b5563" font-family="system-ui, sans-serif" font-size="14">
    <text x="676" y="207">x</text><text x="396" y="48">y</text>
    <text x="376" y="207">0</text><text x="79" y="51">4</text><text x="79" y="111">3</text><text x="79" y="171">2</text><text x="79" y="231">1</text><text x="79" y="291">−1</text>
  </g>
  <!-- y = x + 2 for x &lt; 0 -->
  <path d="M146 65L386 185" fill="none" stroke="#287a67" stroke-width="5" stroke-linecap="round"/>
  <!-- y = x² for x ≥ 0 -->
  <path d="M386 305 C410 304 434 299 458 285 C482 267 506 241 530 205 C554 160 578 107 602 45" fill="none" stroke="#5776b7" stroke-width="5" stroke-linecap="round"/>
  <circle cx="386" cy="65" r="8" fill="#fff" stroke="#287a67" stroke-width="4"/>
  <circle cx="386" cy="305" r="8" fill="#5776b7" stroke="#fff" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="17" font-weight="600">
    <text x="160" y="88" fill="#287a67">y = x + 2, pour x &lt; 0</text>
    <text x="487" y="283" fill="#5776b7">y = x², pour x ≥ 0</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#374151">
    <text x="402" y="61">(0, 2) exclu</text>
    <text x="402" y="312">(0, 0) inclus</text>
  </g>
</svg>
