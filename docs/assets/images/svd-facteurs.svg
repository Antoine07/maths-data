<svg xmlns="http://www.w3.org/2000/svg" width="960" height="390" viewBox="0 0 960 390" role="img" aria-labelledby="titre description">
<title id="titre">Dimensions de la SVD réduite</title>
<desc id="description">Une matrice X de taille n par p se décompose en U de taille n par m, Sigma de taille m par m, et V transposée de taille m par p, où m est le minimum de n et p.</desc>
<rect width="960" height="390" rx="24" fill="#f7f8f2"/>
<g font-family="Arial,sans-serif" fill="#203b36" text-anchor="middle">
<text x="480" y="40" font-size="19" font-weight="700">Une même matrice, trois facteurs compatibles</text>
<rect x="35" y="95" width="180" height="190" rx="12" fill="#e4edda" stroke="#97b68b"/>
<text x="125" y="177" font-size="35">X</text><text x="125" y="213" font-size="18">n × p</text>
<text x="251" y="195" font-size="32">=</text>
<rect x="290" y="95" width="135" height="190" rx="12" fill="#fff" stroke="#97b68b"/>
<text x="357" y="177" font-size="35">U</text><text x="357" y="213" font-size="18">n × m</text>
<text x="455" y="195" font-size="25">×</text>
<rect x="485" y="120" width="140" height="140" rx="12" fill="#ddf18a" stroke="#97b68b"/>
<path d="M506 142 603 239" stroke="#275c47" stroke-width="5" stroke-dasharray="8 15"/>
<text x="555" y="180" font-size="30">Σ</text><text x="555" y="212" font-size="18">m × m</text>
<text x="665" y="195" font-size="25">×</text>
<rect x="705" y="120" width="220" height="140" rx="12" fill="#fff" stroke="#97b68b"/>
<text x="815" y="177" font-size="35">Vᵀ</text><text x="815" y="213" font-size="18">m × p</text>
<text x="480" y="325" font-size="18">m = min(n, p) · conserver k directions donne Xₖ de taille n × p</text>
<text x="480" y="355" font-size="15" fill="#63716a">Les nombres de lignes et colonnes, et non les proportions des rectangles, définissent les dimensions.</text>
</g></svg>
