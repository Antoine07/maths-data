<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" role="img" aria-labelledby="title desc">
  <title id="title">La transposée échange lignes et colonnes</title>
  <desc id="desc">Une matrice de deux lignes et trois colonnes devient une matrice de trois lignes et deux colonnes. Chaque coefficient a indice i j passe à la position j i.</desc>
  <rect width="1100" height="420" rx="24" fill="#f7f8f2"/>
  <text x="550" y="54" text-anchor="middle" fill="#203f38" font-family="system-ui, sans-serif" font-size="29" font-weight="700">Transposer : les lignes deviennent des colonnes</text>

  <text x="290" y="112" text-anchor="middle" fill="#203f38" font-family="system-ui, sans-serif" font-size="24" font-weight="650">A · 2 lignes, 3 colonnes</text>
  <text x="812" y="112" text-anchor="middle" fill="#203f38" font-family="system-ui, sans-serif" font-size="24" font-weight="650">Aᵀ · 3 lignes, 2 colonnes</text>

  <!-- A: each original row has its own color. -->
  <g font-family="system-ui, sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#203f38" stroke="#ffffff" stroke-width="3">
    <rect x="144" y="143" width="92" height="66" rx="9" fill="#dcefe5"/><text x="190" y="176" stroke="none">a₁₁</text>
    <rect x="240" y="143" width="92" height="66" rx="9" fill="#dcefe5"/><text x="286" y="176" stroke="none">a₁₂</text>
    <rect x="336" y="143" width="92" height="66" rx="9" fill="#dcefe5"/><text x="382" y="176" stroke="none">a₁₃</text>
    <rect x="144" y="213" width="92" height="66" rx="9" fill="#f9e4d2"/><text x="190" y="246" stroke="none">a₂₁</text>
    <rect x="240" y="213" width="92" height="66" rx="9" fill="#f9e4d2"/><text x="286" y="246" stroke="none">a₂₂</text>
    <rect x="336" y="213" width="92" height="66" rx="9" fill="#f9e4d2"/><text x="382" y="246" stroke="none">a₂₃</text>
  </g>

  <path d="M480 211h110m-18-17 18 17-18 17" fill="none" stroke="#6c8f63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="535" y="177" text-anchor="middle" fill="#60756d" font-family="system-ui, sans-serif" font-size="17">transposer</text>

  <!-- In Aᵀ, the original row index becomes the column index. -->
  <g font-family="system-ui, sans-serif" font-size="23" text-anchor="middle" dominant-baseline="middle" fill="#203f38" stroke="#ffffff" stroke-width="3">
    <rect x="698" y="137" width="92" height="60" rx="9" fill="#dcefe5"/><text x="744" y="167" stroke="none">a₁₁</text>
    <rect x="794" y="137" width="92" height="60" rx="9" fill="#f9e4d2"/><text x="840" y="167" stroke="none">a₂₁</text>
    <rect x="698" y="202" width="92" height="60" rx="9" fill="#dcefe5"/><text x="744" y="232" stroke="none">a₁₂</text>
    <rect x="794" y="202" width="92" height="60" rx="9" fill="#f9e4d2"/><text x="840" y="232" stroke="none">a₂₂</text>
    <rect x="698" y="267" width="92" height="60" rx="9" fill="#dcefe5"/><text x="744" y="297" stroke="none">a₁₃</text>
    <rect x="794" y="267" width="92" height="60" rx="9" fill="#f9e4d2"/><text x="840" y="297" stroke="none">a₂₃</text>
  </g>

  <rect x="164" y="344" width="772" height="48" rx="14" fill="#e8eddf"/>
  <text x="550" y="375" text-anchor="middle" fill="#203f38" font-family="system-ui, sans-serif" font-size="20">Chaque coefficient change de position : aᵢⱼ → aⱼᵢ</text>
</svg>
