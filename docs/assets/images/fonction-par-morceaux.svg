<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Graphique d'une fonction définie par morceaux</title>
  <desc id="desc">Dans un repère orthonormé, la droite y égale x plus 2 est tracée pour x négatif et se termine par un point ouvert en (0,2). La parabole y égale x au carré est tracée pour x positif ou nul et passe par le point plein (0,0), qui est l'origine du repère.</desc>
  <rect width="760" height="390" rx="18" fill="#f7f8f2"/>
  <rect x="86" y="35" width="600" height="300" rx="8" fill="#fff"/>
  <g stroke="#e2e7e0" stroke-width="1">
    <path d="M146 35V335 M206 35V335 M266 35V335 M326 35V335 M386 35V335 M446 35V335 M506 35V335 M566 35V335 M626 35V335 M686 35V335"/>
    <path d="M86 65H686 M86 125H686 M86 185H686 M86 245H686 M86 305H686"/>
  </g>
  <g stroke="#4b5563" stroke-width="2">
    <path d="M86 185H686"/>
    <path d="M386 335V35"/>
  </g>
  <g fill="#4b5563" font-family="system-ui, sans-serif" font-size="13">
    <text x="676" y="207">x</text><text x="396" y="48">y</text>
    <text x="386" y="207" text-anchor="middle">0</text>
    <text x="146" y="207" text-anchor="middle">−4</text><text x="206" y="207" text-anchor="middle">−3</text><text x="266" y="207" text-anchor="middle">−2</text><text x="326" y="207" text-anchor="middle">−1</text>
    <text x="446" y="207" text-anchor="middle">1</text><text x="506" y="207" text-anchor="middle">2</text><text x="566" y="207" text-anchor="middle">3</text><text x="626" y="207" text-anchor="middle">4</text><text x="686" y="207" text-anchor="middle">5</text>
    <text x="76" y="70" text-anchor="end">2</text><text x="76" y="130" text-anchor="end">1</text><text x="76" y="190" text-anchor="end">0</text><text x="76" y="250" text-anchor="end">−1</text><text x="76" y="310" text-anchor="end">−2</text>
  </g>
  <!-- y = x + 2 for x &lt; 0: the open endpoint is (0,2). -->
  <path d="M146 305L386 65" fill="none" stroke="#287a67" stroke-width="5" stroke-linecap="round"/>
  <!-- y = x² for x ≥ 0: the included endpoint (0,0) is the origin. -->
  <path d="M386 185 C417.6 185 449.2 85.1 480.8 35.2" fill="none" stroke="#5776b7" stroke-width="5" stroke-linecap="round"/>
  <circle cx="386" cy="65" r="8" fill="#fff" stroke="#287a67" stroke-width="4"/>
  <circle cx="386" cy="185" r="8" fill="#5776b7" stroke="#fff" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" font-size="15" font-weight="600">
    <text x="100" y="91" fill="#287a67">y = x + 2, pour x &lt; 0</text>
    <text x="478" y="79" fill="#5776b7">y = x², pour x ≥ 0</text>
  </g>
  <g font-family="system-ui, sans-serif" font-size="13" fill="#374151">
    <rect x="400" y="48" width="91" height="24" rx="5" fill="#fff" opacity=".92"/>
    <text x="405" y="65">(0, 2) exclu</text>
    <rect x="400" y="172" width="96" height="24" rx="5" fill="#fff" opacity=".92"/>
    <text x="405" y="189">(0, 0) inclus</text>
  </g>
  <text x="678" y="363" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" fill="#58675f">Repère orthonormé : même échelle sur les deux axes</text>
</svg>
